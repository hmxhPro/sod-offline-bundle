# ============================================================================
# SOD 前端 + API 反向代理 (nginx)
# ----------------------------------------------------------------------------
# 用法：
#   sudo cp nginx-sod.conf /etc/nginx/conf.d/sod.conf
#   # 把下面的 root 改成实际的 dist 目录绝对路径（install.sh 会自动替换 __SOD_HOME__）
#   sudo nginx -t && sudo systemctl reload nginx
#
# 该配置让前端与 /api 同源（同一端口），因此前端使用相对路径即可，
# 无需在打包时写死服务器 IP，迁移到任何服务器都不用重新构建前端。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;                       # 任意主机名/IP 均匹配

    # ── 上传体积上限（与后端 MAX_UPLOAD_BYTES=2GiB 对齐，留余量）──────────
    client_max_body_size 4g;

    # ── 前端静态资源（SPA）──────────────────────────────────────────────
    root __SOD_HOME__/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # 支持前端路由刷新不 404
    }

    # ── API 反向代理到 FastAPI 后端 ─────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应必须关闭缓冲，否则实时检测帧无法逐帧推送
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 长任务（上传大文件 / 长视频检测）放宽超时
        proxy_connect_timeout 75s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # 健康检查与接口文档（可选，便于排障）
    location ~ ^/(health|livez|readyz|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
